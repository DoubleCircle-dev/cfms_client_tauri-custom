# ---------------------------------------------------------------------------
# Compiler flags for cryptographic acceleration
# ---------------------------------------------------------------------------
#
# The `aes-gcm` crate selects its AES backend at compile time via
# `#[cfg(target_feature = "aes")]` / `#[cfg(target_feature = "ssse3")]`.
# Without these features the crate falls back to a pure-Rust bitsliced
# implementation, which is 3–10× slower than hardware-accelerated AES-NI.
#
# Each [target] section below enables AES-NI + SSSE3 for the three major
# x86_64 platforms.  These are safe to enable on any x86_64 CPU shipped in
# the last decade (Intel Westmere / AMD Bulldozer and newer).
#
# Alternative: replace the per-feature flags with `-C target-cpu=native`,
# which enables *all* instruction-set extensions supported by the build
# machine.  Use `native` for local development; use the explicit feature
# set below for reproducible CI / distribution builds.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+aes,+ssse3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+aes,+ssse3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+aes,+ssse3"]

[build]
rustflags = ["-Z", "threads=8"]
# Route rustc through sccache so compiled artifacts are cached across builds
# and even across `target/` cleanups. `sccache` is installed via Scoop and its
# shim is on PATH. (`build.rustc-wrapper` is the config-level way to set the
# compiler wrapper; an `[env] RUSTC_WRAPPER` entry does NOT affect cargo's own
# wrapper selection.)
# NOTE: cargo's incremental compilation is disabled in `[profile.dev]`
# (Cargo.toml) — sccache cannot cache incremental crates.
rustc-wrapper = "sccache"

# ---------------------------------------------------------------------------
# Browser UI preview — WebView2 debugging port for debug runs
# ---------------------------------------------------------------------------
#
# `pnpm tauri dev` drives `cargo run`, so Cargo sets this variable in the app
# process and the debug build opens the WebView2 CDP endpoint. That lets
# `scripts/dev-ipc-bridge.mjs` forward commands from a regular browser to the
# real backend — see BUILD.md, "Browser UI preview".
#
# Why here rather than in Rust or in the window config:
#   * `tauri build` does not run the app through Cargo, so release binaries
#     never receive it (a `tauri.conf.json` entry or a Rust call would ship it);
#   * `WebviewWindowBuilder::additional_browser_args` would *replace* wry's
#     `--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection` defaults,
#     whereas WebView2 appends this variable on top of them;
#   * Cargo sets it in the parent process, avoiding `std::env::set_var`, which
#     is unsafe in edition 2024.
#
# WebView2 binds the port to the loopback interface. Cargo leaves an
# already-set variable alone, so `WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=... pnpm tauri dev`
# still takes precedence. Change the port here and in CFMS_CDP_PORT (the relay)
# together.
[env]
WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
